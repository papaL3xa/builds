name: Custom Kernel Build

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch from BatAxeKernel'
        required: true
        default: 'main'
        type: string
      make_target:
        description: 'Make target'
        required: false
        default: 'all'
        type: string
      config_file:
        description: 'Custom config file'
        required: false
        default: ''
        type: string
      upload_artifacts:
        description: 'Upload build artifacts'
        required: false
        default: true
        type: boolean

jobs:
  custom-build:
    name: Custom Kernel Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout builds repository
      uses: actions/checkout@v4

    - name: Setup environment
      run: |
        sudo apt update
        sudo apt install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc

    - name: Make build.sh executable
      run: chmod +x build.sh

    - name: Run custom build
      run: |
        ./build.sh \
          --branch "${{ github.event.inputs.target_branch }}" \
          --no-install
        
        # Additional custom build steps
        cd BatAxeKernel
        
        if [ -n "${{ github.event.inputs.config_file }}" ]; then
          cp "${{ github.event.inputs.config_file }}" .config
        fi
        
        make ${{ github.event.inputs.make_target }}

    - name: Upload custom artifacts
      if: ${{ github.event.inputs.upload_artifacts }}
      uses: actions/upload-artifact@v4
      with:
        name: custom-build-${{ github.sha }}
        path: |
          BatAxeKernel/
          build.log
        retention-days: 30