# Build configuration
build:
  # Default branch to build
  default_branch: "main"
  
  # Supported architectures
  architectures:
    - "x86_64"
    - "arm64"
  
  # Build timeout in minutes
  timeout: 120
  
  # Artifacts to preserve
  artifacts:
    - "vmlinuz"
    - "System.map"
    - ".config"
    - "build.log"

# Notification settings
notifications:
  on_success: change
  on_failure: always
  webhooks: []